name: Test dello Scorer con il modello reale

# Avvio manuale: ogni esecuzione consuma token, quindi non parte a ogni push.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEARTECH_TEST_DSN: postgresql://postgres:test@localhost:5432/neartech_test
      # Il segreto configurato su GitHub si chiama Claude; il codice legge ANTHROPIC_API_KEY.
      ANTHROPIC_API_KEY: ${{ secrets.Claude }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa il progetto
        run: pip install -e ".[dev]"

      - name: Crea il database di test
        env:
          PGPASSWORD: test
        run: psql -h localhost -U postgres -c "CREATE DATABASE neartech_test;"

      - name: Esegui i test, incluso il modello reale
        run: pytest -v
