[project]
name = "neartech"
version = "0.1.0"
description = "Knowledge base dei task: misura N (necessità) e D (desiderabilità) dell'apporto umano"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "psycopg[binary]>=3.2,<4",
    "anthropic>=0.40,<1",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neartech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
